<main id="app"></main>

<script src="foods.js"></script>
<script>
'use strict';
/* ====================== utilidades ====================== */
const $=s=>document.querySelector(s);
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let T=iso();
const R0=Math.round,WD=['dom','seg','ter','qua','qui','sex','sáb'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const f1=n=>(Math.round(n*10)/10).toString().replace('.',',');

/* ====================== tabela de alimentos ====================== */
const SRC={T:'TACO',U:'USDA',R:'Rótulo',C:'Receita'};
const STOP=new Set(['de','do','da','dos','das','e','a','o','as','os','ao','na','no','em','para','ou']);
const WEAK=new Set(['com','sem']);
const FB={cs:15,cc:5,cv:45,xic:150,cp:200,cn:100,fat:30,lat:350,gf:500,taca:150,dose:50,pun:30,sc:30,bola:60,pote:170,esp:150,fio:5};
function sing(t){return t.length>3&&t.endsWith('s')&&!t.endsWith('ss')?t.slice(0,-1):t}
function toks(s){return norm(s).replace(/[^a-z0-9\s]/g,' ').replace(/oes\b/g,'ao').replace(/aes\b/g,'ao').split(/\s+/).filter(Boolean).map(sing).filter(t=>!STOP.has(t))}
function mkFood(o){
  const nt=toks(o.n),nameToks=nt.filter(t=>!WEAK.has(t));
  const al=(o.a||'').split(';').map(x=>x.trim()).filter(Boolean);
  const aliasSet=new Set(al.map(x=>toks(x).join(' ')));aliasSet.add(nt.join(' '));
  const all=new Set(nt);al.forEach(x=>toks(x).forEach(t=>all.add(t)));
  return Object.assign(o,{nn:nt.join(' '),nameToks,aliasSet,all,u:o.u||{}});
}
const BASE=[];
(function(){let g='';(typeof FOODS_RAW==='string'?FOODS_RAW:'').split('\n').forEach(l=>{l=l.trim();if(!l)return;
  if(l[0]==='#'){g=l.slice(1).trim();return}
  const a=l.split('|');if(a.length<6)return;
  const u={};(a[7]||'').split(';').forEach(x=>{const kv=x.split('=');if(kv[0]&&kv[1])u[kv[0].trim()]=parseFloat(kv[1])});
  BASE.push(mkFood({n:a[0].trim(),k:+a[1],p:+a[2],c:+a[3],f:+a[4],s:SRC[a[5]]||a[5],g,a:a[6]||'',u}))})})();
let ALLC=null;
function ALL(){if(!ALLC)ALLC=(S.custom||[]).map(x=>mkFood({n:x.n,k:+x.k||0,p:+x.p||0,c:+x.c||0,f:+x.f||0,s:'Meu',g:'Meus alimentos',a:'',u:{d:100}})).concat(BASE);return ALLC}
function search(q,max){max=max||6;
  const all=toks(q),qt=all.filter(t=>!WEAK.has(t)),qw=all.filter(t=>WEAK.has(t));
  if(!qt.length)return[];
  const qs=qt.join(' '),res=[];
  ALL().forEach((f,i)=>{let sc=0,m=0;
    for(const t of qt){
      if(f.all.has(t)){sc+=3;m++}
      else if(t.length>=3){let st=false;for(const x of f.all){if(x.length>=3&&x.startsWith(t)){st=true;break}}if(st){sc+=2;m++}}
    }
    if(!m||m<Math.ceil(qt.length/2))return;
    sc-=(qt.length-m)*4;
    if(f.aliasSet.has(qs))sc+=6;
    if(f.nn.startsWith(qs))sc+=3;else if(f.nn.includes(qs))sc+=1.5;
    for(const w of qw)if(f.all.has(w))sc+=1.5;
    sc-=0.3*Math.max(0,f.nameToks.length-m);
    if(f.s==='Meu')sc+=0.5;
    res.push([sc,i,f])});
  res.sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  return res.slice(0,max).map(x=>x[2]);
}

/* ====================== leitura do texto da refeição ====================== */
const NUMW={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,meio:.5,meia:.5};
const UNITS=[
 ['colher de sopa|colheres de sopa|colher sopa|cs','cs'],['colher de cha|colheres de cha|colher cha|cc','cc'],
 ['colher de sobremesa|colheres de sobremesa','csob'],['colher de servir|colheres de servir|colher grande|cv','cv'],['colher|colheres','cs'],
 ['xicara|xicaras|xic','xic'],['copo|copos','cp'],['concha|conchas','cn'],['fatia|fatias','fat'],
 ['unidade|unidades|und|un','un'],['pedaco|pedacos','pc'],['porcao|porcoes|prato|pratos','pt'],
 ['lata|latas','lat'],['garrafa|garrafas','gf'],['taca|tacas','taca'],['dose|doses','dose'],['punhado|punhados','pun'],
 ['scoop|scoops|dosador|dosadores|medida|medidas','sc'],['bola|bolas','bola'],['pote|potes','pote'],
 ['pacote|pacotes|pct','pct'],['espiga|espigas','esp'],['file|files|bife|bifes','un'],['fio|fios','fio']];
const UNITL=[];UNITS.forEach(([alts,key])=>alts.split('|').forEach(a=>UNITL.push([a,key])));
UNITL.sort((a,b)=>b[0].length-a[0].length);
const MASS={g:1,gr:1,grama:1,gramas:1,kg:1000,quilo:1000,quilos:1000,kilo:1000,ml:1,l:1000,litro:1000,litros:1000};
function numTok(t){
  let m;
  if((m=/^(\d+(?:[.,]\d+)?)(g|gr|kg|ml|l)$/.exec(t)))return{n:parseFloat(m[1].replace(',','.')),mass:MASS[m[2]],len:1};
  if(/^\d+(?:[.,]\d+)?$/.test(t))return{n:parseFloat(t.replace(',','.')),len:1};
  if((m=/^(\d+)\/(\d+)$/.exec(t)))return{n:+m[1]/+m[2],len:1};
  if(NUMW[t]!=null)return{n:NUMW[t],len:1};
  return null;
}
function parseSeg(seg){
  const tk=norm(seg).replace(/[()]/g,' ').trim().split(/\s+/).filter(Boolean);
  let num=null,unit=null,mass=null,used=new Set();
  for(let i=0;i<tk.length;i++){
    const nt=numTok(tk[i]);if(!nt)continue;
    num=nt.n;used.add(i);
    if(nt.mass!=null){mass=nt.mass;break}
    const rest=tk.slice(i+1).join(' ');
    if(tk[i+1]&&MASS[tk[i+1]]!=null){mass=MASS[tk[i+1]];used.add(i+1);break}
    for(const [a,key] of UNITL){
      if(rest===a||rest.startsWith(a+' ')){unit=key;const n=a.split(' ').length;for(let j=1;j<=n;j++)used.add(i+j);break}
    }
    break;
  }
  const q=tk.filter((t,i)=>!used.has(i)).join(' ');
  return{num,unit,mass,q};
}
function portion(f,k){
  if(k==='csob')return(f.u.cs||15)*0.66;
  if(f.u[k]!=null)return f.u[k];
  if(FB[k]!=null)return FB[k];
  return f.u.d||100;
}
function gramsFor(p,f){
  if(p.mass!=null)return Math.round((p.num||1)*p.mass*10)/10;
  const q=p.num!=null?p.num:1;
  const key=p.unit||(p.num!=null?'un':'d');
  const base=key==='d'?(f.u.d||100):portion(f,key);
  return Math.round(q*base*10)/10;
}
function mkItem(p,f,cands,name){return{p,f,cands:cands||(f?[f]:[]),name:name||(f?f.n:''),g:f?gramsFor(p,f):(p.mass!=null?(p.num||1)*p.mass:100),mode:p.mass!=null?'mass':'port',man:{k:0,p:0,c:0,f:0},searching:false}}
function parseMeal(text){
  let s=norm(text).replace(/(\d),(\d)/g,'$1.$2');
  const segs=s.split(/[,;\n+]+|\s+e\s+(?=\d|meio |meia |um |uma |dois |duas |tres |quatro |cinco )/).map(x=>x.trim()).filter(Boolean);
  const out=[];
  segs.forEach(seg=>{
    const p=parseSeg(seg),c=search(p.q,6),f=c[0]||null;
    if((!(f&&covers(f,p.q))||(f&&/\scom\s/.test(' '+p.q+' ')&&!f.all.has('com')))&&/\s(?:e|com)\s/.test(' '+p.q+' ')){
      const parts=p.q.split(/\s+(?:e|com)\s+/).map(x=>x.trim()).filter(Boolean);
      const found=parts.map(x=>search(x,6));
      if(parts.length>1&&found.every(r=>r.length)){
        parts.forEach((x,i)=>{const pp=i===0?{num:p.num,unit:p.unit,mass:p.mass,q:x}:{num:null,unit:null,mass:null,q:x},cc=found[i];out.push(mkItem(pp,cc[0],cc,cc[0].n))});
        return}
    }
    out.push(mkItem(p,f,c,f?f.n:p.q));
  });
  return out;
}

  const r=new FileReader();r.onload=()=>{try{
    const lines=String(r.result).replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());
    const sep=(lines[0]||'').includes(';')?';':',';let n=0;
    const num=x=>parseFloat(String(x||'').replace(',','.'))||0;
    lines.forEach(l=>{const a=l.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));if(a.length<2)return;
      const k=num(a[1]);if(!a[0]||!k||/^nome|^alimento/i.test(a[0]))return;

    ALLC=null;save();toast(n+' alimento(s) importado(s)');R()}catch(e){toast('Não consegui ler esse arquivo.')}inp.value=''};
  r.readAsText(file)}

  order.forEach(n=>{const g=groups[n],sum=g.reduce((a,x)=>a+x[0].k,0);
    h+=`<div class="card"><div class="meal-h"><div><span class="e">${MI[n]||'⭐'}</span><b>${esc(n)}</b></div><b>${R0(sum)} kcal</b></div>`+
    g.map(([m,i])=>`<div class="mrow"><ul>${(m.items&&m.items.length?m.items.map(x=>`<li>${R0(x.g)} g ${esc(x.nome)} · ${R0(x.kcal)}</li>`):[`<li>${esc((m.t||'').slice(0,120))}</li>`]).join('')}</ul><div class="acts"><button class="ghost" aria-label="Favoritar" onclick="favMeal(${i})">★</button><button class="danger ghost" aria-label="Apagar" onclick="delMeal(${i})">×</button></div></div>`).join('')+'</div>'});
  const ct=cmp(true),cr=cmp(false),avg=(6*ct.target+cr.target)/7,mnt=(6*ct.burn+cr.burn)/7;
  h+=`<div class="card"><details><summary>Sua meta diária</summary><div style="margin-top:12px"><div class="big">${R0(avg)} <small>kcal/dia em média</small></div>
  <p class="mut">Média da semana para o déficit de ${R0(p.def)} kcal (6 dias de treino e 1 de descanso).</p>
  <table><tr><th></th><th>Gasto</th><th>Comer</th></tr><tr><td>Dia de treino</td><td>${R0(ct.burn)}</td><td><b>${R0(ct.target)}</b></td></tr><tr><td>Dia de descanso</td><td>${R0(cr.burn)}</td><td><b>${R0(cr.target)}</b></td></tr><tr><td>Para manter o peso</td><td colspan="2">${R0(mnt)} kcal/dia</td></tr></table>
  <p class="mut">Gasto = repouso (${R0(cr.tmb)}) + dia a dia (${R0(cr.base-cr.tmb)})${p.tk?' + treino ('+R0(p.tk)+')':''}. IMC ${(p.w/Math.pow(p.h/100,2)).toFixed(1)}.</p></div></details></div>`;
  return h;
}
function waterTab(){
  const c=calc(T),d=day(T),l=(d.water||0)/1000,pct=Math.min(1,l/c.water),y=108-102*pct,P='M50 6C50 6 14 46 14 72a36 36 0 0 0 72 0C86 46 50 6 50 6z';
  let wk='';for(let i=6;i>=0;i--){const dt=new Date(Date.now()-i*864e5),dd=iso(dt);wk+=lbar(WD[dt.getDay()]+' '+dd.slice(8),((S.days[dd]||{}).water||0)/1000,calc(dd).water,'L','var(--w)')}
  return`<div class="card" style="text-align:center"><h2>Água de hoje</h2>
  <svg class="drop" viewBox="0 0 100 112" role="img" aria-label="${l.toFixed(2)} de ${c.water.toFixed(1)} litros"><defs><clipPath id="dc"><path d="${P}"/></clipPath></defs><path d="${P}" fill="var(--wt)"/><rect x="0" y="${y.toFixed(1)}" width="100" height="${(112-y).toFixed(1)}" fill="var(--w)" clip-path="url(#dc)"/><path d="${P}" fill="none" stroke="var(--w)" stroke-width="3"/></svg>
  <div class="big" style="margin-top:8px">${l.toFixed(2).replace('.',',')} <small>/ ${c.water.toFixed(1).replace('.',',')} L</small></div>
  <div class="chips" style="justify-content:center;margin-top:14px"><button onclick="water(250)">+250 ml</button><button onclick="water(500)">+500 ml</button><button onclick="water(1000)">+1 L</button><button class="soft" onclick="water(-250)">−250</button></div>
  <p class="mut">Meta: 35 ml por kg (${S.profile.w} kg)${isTrain(T)?' + 500 ml por ser dia de treino':''}.</p></div>
  <div class="card"><h2>Últimos 7 dias</h2>${wk}</div>`;
}
function wChart(){const w=S.weights.slice(-30);if(w.length<2)return'<p class="mut">Registre o peso em mais de um dia para ver o gráfico.</p>';
  const ys=w.map(x=>x.w),mn=Math.min(...ys)-1,mx=Math.max(...ys)+1,W=320,H=150,px=14,py=18;
  const pt=w.map((x,i)=>[px+i*(W-2*px)/(w.length-1),H-py-(x.w-mn)/(mx-mn)*(H-2*py)]);
  const line=pt.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de peso"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pri)" stop-opacity=".28"/><stop offset="1" stop-color="var(--pri)" stop-opacity="0"/></linearGradient></defs>
  <polygon fill="url(#wg)" points="${px},${H-py} ${line} ${W-px},${H-py}"/><polyline fill="none" stroke="var(--pri)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" points="${line}"/>
  ${pt.map((q,i)=>i===pt.length-1?`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="var(--pri)" stroke="var(--surf)" stroke-width="2.5"/>`:'').join('')}
  <text x="${px}" y="12" font-size="10" fill="var(--mut)">${mx.toFixed(1)} kg</text><text x="${px}" y="${H-3}" font-size="10" fill="var(--mut)">${mn.toFixed(1)} kg</text></svg>`}
function forecast(){const p=S.profile;let h='';
  const rec=S.weights.filter(x=>x.d>=iso(new Date(Date.now()-14*864e5)));
  if(rec.length>=2){const a=rec[0],b=rec[rec.length-1],dd=(new Date(b.d)-new Date(a.d))/864e5;
    if(dd>=6){const r=(b.w-a.w)/dd*7;h+=`<p class="mut">Tendência real: ${r>0?'+':''}${r.toFixed(2).replace('.',',')} kg/semana.</p>`;
      if(-r>p.w*0.01)h+='<p class="warn">Você está perdendo mais de 1% do peso por semana. Considere subir as calorias para preservar músculo e energia.</p>'}}
  const wk=p.def*7/7700;
  if(p.def<=0)h+='<p class="mut">Sem déficit, o peso tende a se manter.</p>';
  else if(p.w<=p.goal)h+='<p class="mut">Você já está na meta de peso.</p>';
  else{const wks=(p.w-p.goal)/wk,dt=new Date(Date.now()+wks*7*864e5);
    h+=`<p>No ritmo do déficit atual (~${wk.toFixed(2).replace('.',',')} kg/semana), você chega a ${p.goal} kg em cerca de ${Math.ceil(wks)} semanas (${dt.toLocaleDateString('pt-BR')}).</p><p class="mut">Estimativa teórica; o peso real oscila.</p>`}
  return h}
function weightTab(){const p=S.profile;
  return`<div class="card"><h2>Peso</h2><div class="row"><input id="wi" type="text" inputmode="decimal" placeholder="${p.w} kg" aria-label="Peso de hoje em kg"><button onclick="logW()" style="white-space:nowrap">Registrar</button></div></div><div class="card">${wChart()}${forecast()}</div>`}
function weekTab(){let rows='',n=0,K=0,P=0,W=0,ok=0,gap=0,wn=0,bars='';
  const BW=320,BH=150,bw=28,gx=(BW-7*bw)/8;let maxv=0;const dat=[];
  for(let i=6;i>=0;i--){const dt=new Date(Date.now()-i*864e5),d=iso(dt),x=S.days[d],c=calc(d),t=tot(d),has=x&&x.meals&&x.meals.length,w=S.weights.find(y=>y.d===d);
    dat.push({dt,has,k:t.k,tg:c.target});maxv=Math.max(maxv,t.k,c.target);
    if(has){n++;K+=t.k;P+=t.p;if(t.k<=c.target+100)ok++;gap+=c.burn-t.k}
    if(x&&x.water){W+=x.water/1000;wn++}
    rows+=`<tr><td>${WD[dt.getDay()]} ${d.slice(8)}</td><td>${has?R0(t.k):'–'}</td><td>${R0(c.target)}</td><td>${has?(t.k<=c.target+100?'✓':'✗'):''}</td><td>${x&&x.water?(x.water/1000).toFixed(1):'–'}</td><td>${w?w.w:''}</td></tr>`}
  maxv=maxv*1.12||1;const base=BH-22;
  dat.forEach((o,i)=>{const x=gx+i*(bw+gx),hh=o.has?Math.max(3,o.k/maxv*(base-8)):0,col=o.k<=o.tg+100?'var(--pri)':'var(--acc)';
    bars+=`<rect x="${x.toFixed(1)}" y="${(base-hh).toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}" rx="8" fill="${col}"/><rect x="${x.toFixed(1)}" y="${base-3}" width="${bw}" height="3" rx="1.5" fill="var(--line)"/><text x="${(x+bw/2).toFixed(1)}" y="${BH-6}" font-size="11" text-anchor="middle" fill="var(--mut)">${WD[o.dt.getDay()]}</text>`});
  const ty=base-(dat[0].tg/maxv)*(base-8);
  let h=`<div class="card"><h2>Calorias na semana</h2><svg class="chart" viewBox="0 0 ${BW} ${BH}" role="img" aria-label="Calorias dos últimos 7 dias">${bars}<line x1="0" x2="${BW}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="var(--mut)" stroke-dasharray="4 4" stroke-width="1.2"/></svg><p class="mut" style="margin-bottom:0">Linha tracejada: sua meta. Barras laranja passaram da meta.</p></div>`;
  h+=`<div class="card"><h2>Últimos 7 dias</h2><div style="overflow-x:auto"><table><tr><th>Dia</th><th>Comeu</th><th>Meta</th><th></th><th>Água L</th><th>Peso</th></tr>${rows}</table></div></div>`;
  if(!n)return h+'<div class="card"><p class="mut" style="margin:0">Registre refeições para ver o resumo da semana.</p></div>';
  h+=`<div class="card"><h2>Resumo</h2><div class="row" style="text-align:center"><div style="flex:1"><div class="big" style="font-size:26px">${R0(K/n)}</div><span class="mut">kcal/dia</span></div><div style="flex:1"><div class="big" style="font-size:26px">${ok}/${n}</div><span class="mut">dias na meta</span></div><div style="flex:1"><div class="big" style="font-size:26px">${R0(P/n)} g</div><span class="mut">proteína/dia</span></div></div>
  <p>Déficit real nos dias registrados: <b>${R0(gap)} kcal</b>, cerca de ${(gap/7700).toFixed(2).replace('.',',')} kg de gordura (estimativa).</p><p class="mut">Água média: ${wn?(W/wn).toFixed(1).replace('.',','):'0'} L/dia.</p></div>`;
  return h}
function cfgTab(){const p=S.profile,cr=cmp(false),warn=[];
  if(p.def>700)warn.push('Déficit alto: aumenta o risco de perder massa muscular, ficar sem energia e render menos nos treinos.');
  if(cr.target<cr.tmb)warn.push('Em dias de descanso a meta fica abaixo do seu gasto em repouso (~'+R0(cr.tmb)+' kcal).');
  const th=document.documentElement.getAttribute('data-theme')||'auto';
  return`<div class="card"><h2>Perfil e meta</h2><label>Déficit calórico: <b>${R0(p.def)} kcal/dia</b> (${p.def<=0?'manutenção':p.def<=400?'leve':p.def<=600?'moderado':p.def<=800?'forte':'agressivo'})</label>
  <input type="range" min="0" max="1200" step="50" value="${p.def}" aria-label="Déficit calórico" oninput="this.previousElementSibling.querySelector('b').textContent=this.value+' kcal/dia'" onchange="setP('def',this.value)">
  ${warn.map(w=>`<p class="warn">${w}</p>`).join('')}
  <div class="g2" style="margin-top:10px"><div><label>Sexo</label><select onchange="setP('sex',this.value)"><option value="M" ${p.sex==='M'?'selected':''}>Masculino</option><option value="F" ${p.sex==='F'?'selected':''}>Feminino</option></select></div>
  <div><label>Idade</label><input type="number" inputmode="numeric" value="${p.age}" onchange="setP('age',this.value)"></div>
  <div><label>Altura (cm)</label><input type="number" inputmode="numeric" value="${p.h}" onchange="setP('h',this.value)"></div>
  <div><label>Peso meta (kg)</label><input type="text" inputmode="decimal" value="${p.goal}" onchange="setP('goal',this.value)"></div>
  <div><label>Gasto do treino (kcal)</label><input type="number" inputmode="numeric" value="${p.tk}" onchange="setP('tk',this.value)"></div>
  <div><label>Peso atual (kg)</label><input type="text" inputmode="decimal" value="${p.w}" onchange="setP('w',this.value)"></div></div>
  <p class="mut">Gasto em repouso (fórmula Mifflin-St Jeor) × 1,375 para o dia a dia, mais o treino. São estimativas e não substituem um nutricionista ou médico.</p></div>
  <div class="card"><h2>Meus alimentos</h2><p class="mut" style="margin-top:0">Adicione o que não está na tabela (valores por 100 g, do rótulo). Eles aparecem primeiro nas buscas.</p>
  <input id="cn" placeholder="Nome do alimento" aria-label="Nome do alimento"><div class="g2" style="grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px">${[['k','kcal'],['p','P g'],['c','C g'],['f','G g']].map(([k,l])=>`<div><label>${l}</label><input id="c${k}" type="text" inputmode="decimal"></div>`).join('')}</div>
  <div class="row" style="margin-top:10px"><button onclick="addCustom()">Adicionar</button><label class="chip" style="margin:0">Importar CSV<input type="file" accept=".csv,text/csv,text/plain" style="display:none" onchange="importFoods(this)"></label></div>
  <p class="mut">CSV: nome;kcal;proteína;carboidrato;gordura (por 100 g), um alimento por linha.</p>
  ${S.custom.map((x,i)=>`<div class="frow"><span>${esc(x.n)}<br><span class="mut">${R0(x.k)} kcal · P ${f1(x.p)} · C ${f1(x.c)} · G ${f1(x.f)}</span></span><button class="danger ghost" aria-label="Remover" onclick="delCustom(${i})">×</button></div>`).join('')}</div>
  <div class="card"><h2>Aparência</h2><div class="chips">${[['auto','Automático'],['light','Claro'],['dark','Escuro']].map(([v,l])=>`<button class="chip ${th===v?'on':''}" onclick="setTheme('${v}')">${l}</button>`).join('')}</div></div>
  <div class="card"><h2>Seus dados</h2><p class="mut" style="margin-top:0">Tudo fica guardado só neste aparelho. Faça backup de vez em quando para não perder nada.</p>
  <div class="chips"><button class="soft" onclick="exportBackup()">Salvar backup</button><label class="chip" style="margin:0;padding:11px 16px;border-radius:14px">Restaurar backup<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label><button class="soft" onclick="exportCsv()">Baixar CSV</button></div>
  <button class="danger" style="margin-top:8px;padding-left:0" onclick="resetAll()">Apagar todos os dados</button></div>
  <div class="card"><h2>Sobre a tabela de alimentos</h2><p class="mut" style="margin-top:0">${BASE.length} alimentos com valores aproximados por 100 g, reunidos a partir de referências como a TACO (Unicamp) e a USDA, de rótulos médios de industrializados e de receitas caseiras. A origem aparece em cada item. Para precisão, confira o rótulo ou a TACO oficial e use “Meus alimentos”.</p></div>`}

function R(){T=iso();
  const dt=new Date(),ds=dt.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const titles={cal:'Hoje',agua:'Água',peso:'Peso',sem:'Semana',cfg:'Ajustes'};
  const a=document.activeElement,aid=a&&a.id&&$('#app').contains(a)?a.id:null,ss=aid&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;
  let h=`<h1>${titles[tab]}</h1><p class="sub">${esc(ds)}</p>`;
  h+=tab==='cal'?todayTab():tab==='agua'?waterTab():tab==='peso'?weightTab():tab==='sem'?weekTab():cfgTab();
  const op=$('#app details[open]')?1:0;
  $('#app').innerHTML=h;$('#tabs').innerHTML=tabsHtml();
  if(op){const d=$('#app details');if(d)d.open=true}
  if(tab==='cal'&&!sheet&&!$('.fab'))document.body.insertAdjacentHTML('beforeend','<button class="fab" onclick="openSheet()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Adicionar</button>');
  if(tab!=='cal'||sheet){const f=$('.fab');if(f)f.remove()}
  if(aid){const e=document.getElementById(aid);if(e){e.focus({preventScroll:true});if(ss&&e.setSelectionRange){try{e.setSelectionRange(ss[0],ss[1])}catch(x){}}}}
}
R();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&iso()!==T&&!sheet)R()});
</script>
</body>
